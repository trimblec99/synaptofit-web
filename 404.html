<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="same-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — SynaptoFit</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="/logo.png">
<!-- GitHub Pages shows this for any address that doesn't exist, at THAT address,
     so every link and image here is absolute (starts with /). -->
<style>
:root{--gold:#D4AF37;--bg:#0A0A0A;--bg-2:#121212;--ink:#f2f2f2;--muted:#9a9a9a;--line:#262626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px;width:100%}
a{color:var(--gold)}
header{border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:19px}
.brand span{color:var(--gold)}
.brand img{width:26px;height:26px;display:block}
main{flex:1;display:flex;align-items:center;padding:72px 0}
h1{font-size:40px;line-height:1.15;margin:0 0 14px;letter-spacing:-.02em}
p{color:#cfcfcf;max-width:56ch;margin:0 0 28px;font-size:17px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 24px;border-radius:8px;text-decoration:none;font-weight:600;font-size:15.5px}
.btn-primary{background:var(--gold);color:#0A0A0A}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold)}
footer{border-top:1px solid var(--line);padding:26px 0 34px;color:var(--muted);font-size:14px}
footer a{color:var(--muted)}
@media(max-width:720px){h1{font-size:30px}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="/"><img src="/logo.png" alt="" width="26" height="26"><b>Synapto<span>Fit</span></b></a>
  </div>
</header>
<main>
  <div class="wrap">
    <h1>Page not found</h1>
    <p>That page doesn't exist, or it has moved. Everything on the site is a click away from here.</p>
    <div class="cta">
      <a class="btn btn-primary" href="/">Go to the homepage</a>
      <a class="btn btn-ghost" href="/#beta">Join the beta</a>
      <a class="btn btn-ghost" href="/legal/">Legal</a>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">Questions? <a href="mailto:support@synaptofit.com">support@synaptofit.com</a></div>
</footer>
</body>
</html>
